[project]
name = "tech-panda-inventory-backend"
version = "0.1.0"
description = "Self-hosted electronics inventory backend"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.17.2",
  "argon2-cffi==25.1.0",
  "email-validator==2.3.0",
  "fastapi==0.124.2",
  "gunicorn==23.0.0",
  "Pillow==12.0.0",
  "psycopg[binary]==3.3.2",
  "pydantic-settings==2.12.0",
  "PyJWT==2.10.1",
  "python-multipart==0.0.20",
  "reportlab==5.0.0",
  "SQLAlchemy==2.0.45",
  "uvicorn[standard]==0.38.0",
]

[project.optional-dependencies]
test = [
  "httpx==0.28.1",
  "pytest==9.0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
